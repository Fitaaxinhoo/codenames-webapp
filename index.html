<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Codenames - Choose Card</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            margin-bottom: 16px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
        }

        .clue {
            margin-top: 6px;
            font-size: 15px;
            opacity: 0.75;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .card {
            min-height: 64px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #f2f2f2);
            color: var(--tg-theme-text-color, #222222);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            padding: 10px;
        }

        .card:active {
            transform: scale(0.97);
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            opacity: 0.65;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="title">🎯 Choose a Card</div>
        <div class="clue" id="clue">
            Choose one of the cards below.
        </div>
    </div>

    <div class="board" id="board"></div>

    <div class="empty" id="empty" style="display: none;">
        No cards available.
    </div>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);

        const clue = params.get("clue");
        const number = params.get("number");

        if (clue) {
            document.getElementById("clue").textContent =
                `💡 ${clue} ${number || ""}`;
        }

        /*
         * Temporary test cards.
         *
         * Later the Python bot will send the REAL
         * unrevealed cards for the current game.
         */
        const cards = [
            "CASTLE",
            "MOON",
            "APPLE",
            "RIVER",
            "ROBOT",
            "CROWN",
            "PIZZA",
            "TRAIN",
            "SPACE",
            "PENGUIN"
        ];

        const board = document.getElementById("board");
        const empty = document.getElementById("empty");

        if (cards.length === 0) {
            empty.style.display = "block";
        }

        cards.forEach((word) => {

            const button = document.createElement("button");

            button.className = "card";
            button.textContent = word;

            button.addEventListener("click", () => {

                /*
                 * This is the important part.
                 *
                 * Later we will send the selected word
                 * securely to the Telegram bot.
                 */

                tg.HapticFeedback.impactOccurred("medium");

                tg.showPopup({
                    title: "Card selected",
                    message: `You selected: ${word}`,
                    buttons: [
                        {
                            type: "ok"
                        }
                    ]
                });
            });

            board.appendChild(button);
        });
    </script>

</body>
</html>
