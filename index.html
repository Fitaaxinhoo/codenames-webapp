<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Codenames - Choose Card</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            font-family: Arial, sans-serif;
        }
        .header { text-align: center; margin-bottom: 16px; }
        .title { font-size: 22px; font-weight: 700; }
        .clue { margin-top: 6px; font-size: 15px; opacity: .75; }
        .board {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }
        .card {
            min-height: 64px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 12px;
            background: var(--tg-theme-secondary-bg-color, #f2f2f2);
            color: var(--tg-theme-text-color, #222222);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            padding: 10px;
        }
        .card:active { transform: scale(.97); }
        .empty { text-align: center; padding: 30px 10px; opacity: .65; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">🎯 Choose a Card</div>
        <div class="clue" id="clue">Choose one of the cards below.</div>
    </div>

    <div class="board" id="board"></div>
    <div class="empty" id="empty" style="display:none;">No cards available.</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const params = new URLSearchParams(window.location.search);
        const chatId = params.get("chat_id");
        const clue = params.get("clue");
        const number = params.get("number");

        if (clue) {
            document.getElementById("clue").textContent =
                `💡 ${clue} ${number || ""}`;
        }

        let cards = [];
        try {
            cards = JSON.parse(params.get("cards") || "[]");
        } catch (error) {
            cards = [];
        }

        const board = document.getElementById("board");
        const empty = document.getElementById("empty");

        if (!chatId || !Array.isArray(cards) || cards.length === 0) {
            empty.style.display = "block";
        }

        cards.forEach((card) => {
            const button = document.createElement("button");
            button.className = "card";
            button.textContent = card.w;

            button.addEventListener("click", () => {
                tg.HapticFeedback.impactOccurred("medium");

                tg.showConfirm(
                    `Choose ${card.w}?`,
                    (confirmed) => {
                        if (!confirmed) return;

                        tg.sendData(JSON.stringify({
                            chat_id: chatId,
                            index: card.i
                        }));
                    }
                );
            });

            board.appendChild(button);
        });
    </script>
</body>
</html>
